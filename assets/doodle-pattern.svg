<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Hand-drawn style doodle pattern inspired by Taif wrapping paper -->
  <g fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Row 1 -->
    <!-- Arrow pointing right -->
    <path d="M20 30 L45 30 M38 24 L45 30 L38 36"/>
    
    <!-- Heart -->
    <path d="M90 25 C85 18 75 22 80 32 C85 42 95 42 100 32 C105 22 95 18 90 25"/>
    
    <!-- Envelope -->
    <rect x="130" y="20" width="30" height="22" rx="2"/>
    <path d="M130 20 L145 35 L160 20"/>
    
    <!-- @TAIF text -->
    <text x="195" y="38" font-family="Arial" font-size="14" fill="#1a1a1a" opacity="0.6">@TAIF</text>
    
    <!-- Small tree -->
    <path d="M280 40 L280 55"/>
    <path d="M272 32 L280 22 L288 32"/>
    <path d="M268 42 L280 28 L292 42"/>
    
    <!-- Squiggle wave -->
    <path d="M330 30 Q340 20 350 30 Q360 40 370 30"/>
    
    <!-- Row 2 -->
    <!-- Hand/wave -->
    <path d="M25 90 Q30 80 35 90 Q40 100 45 90 Q50 80 55 90"/>
    
    <!-- Circle with dot -->
    <circle cx="95" cy="90" r="12"/>
    <circle cx="95" cy="90" r="3" fill="#1a1a1a"/>
    
    <!-- Paper airplane -->
    <path d="M140 75 L170 90 L150 95 L140 75 M150 95 L155 110"/>
    
    <!-- Flower -->
    <circle cx="220" cy="85" r="6"/>
    <circle cx="220" cy="73" r="5"/>
    <circle cx="230" cy="80" r="5"/>
    <circle cx="230" cy="92" r="5"/>
    <circle cx="220" cy="97" r="5"/>
    <circle cx="210" cy="92" r="5"/>
    <circle cx="210" cy="80" r="5"/>
    <path d="M220 97 L220 120"/>
    
    <!-- Lightning bolt -->
    <path d="M285 70 L275 90 L285 88 L275 110"/>
    
    <!-- Three dots -->
    <circle cx="340" cy="80" r="4" fill="#1a1a1a"/>
    <circle cx="355" cy="90" r="4" fill="#1a1a1a"/>
    <circle cx="345" cy="100" r="4" fill="#1a1a1a"/>
    
    <!-- Row 3 -->
    <!-- Star -->
    <path d="M35 150 L38 160 L48 160 L40 167 L43 177 L35 171 L27 177 L30 167 L22 160 L32 160 Z"/>
    
    <!-- Instagram icon style -->
    <rect x="80" y="140" width="28" height="28" rx="6"/>
    <circle cx="94" cy="154" r="8"/>
    <circle cx="103" cy="145" r="2.5" fill="#1a1a1a"/>
    
    <!-- Tulip -->
    <path d="M155 170 L155 145 Q160 135 155 128 Q150 135 155 145"/>
    <path d="M148 148 Q155 140 162 148"/>
    
    <!-- Arabic letter 7 stylized -->
    <text x="200" y="165" font-family="Arial" font-size="28" fill="#1a1a1a" opacity="0.4">7</text>
    
    <!-- Leaf branch -->
    <path d="M270 140 Q285 150 280 165"/>
    <path d="M275 147 Q265 143 268 135"/>
    <path d="M278 155 Q288 151 292 143"/>
    
    <!-- Coffee cup -->
    <path d="M335 145 L340 175 L365 175 L370 145 Z"/>
    <path d="M370 152 Q380 152 380 160 Q380 168 370 168"/>
    <path d="M345 140 Q350 130 355 140 Q360 130 365 140"/>
    
    <!-- Row 4 -->
    <!-- Pencil -->
    <path d="M20 220 L50 220 L55 225 L50 230 L20 230 Z"/>
    <path d="M55 225 L62 225"/>
    <line x1="25" y1="220" x2="25" y2="230"/>
    
    <!-- Music note -->
    <circle cx="95" cy="235" r="6" fill="#1a1a1a"/>
    <path d="M101 235 L101 205 L115 200 L115 225"/>
    <circle cx="109" cy="230" r="6" fill="#1a1a1a"/>
    
    <!-- Camera -->
    <rect x="140" y="210" width="35" height="25" rx="3"/>
    <circle cx="157" cy="222" r="8"/>
    <rect x="145" y="205" width="12" height="6" rx="1"/>
    
    <!-- Paint palette -->
    <ellipse cx="225" cy="225" rx="20" ry="15"/>
    <circle cx="215" cy="220" r="4" fill="#1a1a1a"/>
    <circle cx="225" cy="215" r="3" fill="#1a1a1a"/>
    <circle cx="235" cy="220" r="3" fill="#1a1a1a"/>
    <circle cx="230" cy="228" r="4"/>
    
    <!-- Gift box -->
    <rect x="280" y="215" width="30" height="25" rx="2"/>
    <line x1="295" y1="215" x2="295" y2="240"/>
    <path d="M280 225 L310 225"/>
    <path d="M285 215 Q295 205 305 215"/>
    
    <!-- Compass/direction -->
    <circle cx="360" cy="225" r="15"/>
    <path d="M360 212 L360 238"/>
    <path d="M347 225 L373 225"/>
    <path d="M360 215 L363 225 L360 235 L357 225 Z" fill="#1a1a1a"/>
    
    <!-- Row 5 -->
    <!-- Book -->
    <path d="M25 290 L25 320 Q40 315 55 320 L55 290 Q40 295 25 290"/>
    <path d="M40 292 L40 318"/>
    
    <!-- Yarn ball -->
    <circle cx="100" cy="305" r="15"/>
    <path d="M90 298 Q100 308 110 298"/>
    <path d="M88 308 Q100 298 112 308"/>
    
    <!-- Diamond -->
    <path d="M155 285 L170 300 L155 325 L140 300 Z"/>
    <path d="M140 300 L155 295 L170 300"/>
    <path d="M155 295 L155 325"/>
    
    <!-- Lightbulb -->
    <path d="M220 280 Q200 295 210 315 L230 315 Q240 295 220 280"/>
    <rect x="212" y="315" width="16" height="8" rx="1"/>
    <path d="M210 290 Q220 300 230 290"/>
    
    <!-- Ribbon/bow -->
    <path d="M280 295 Q265 285 270 305 Q280 295 290 305 Q295 285 280 295"/>
    <circle cx="280" cy="305" r="5" fill="#1a1a1a"/>
    <path d="M275 310 L275 325"/>
    <path d="M285 310 L285 325"/>
    
    <!-- Pin/marker -->
    <circle cx="350" cy="290" r="10"/>
    <path d="M350 300 L350 325"/>
    <circle cx="350" cy="290" r="4" fill="#1a1a1a"/>
    
    <!-- Row 6 (bottom) -->
    <!-- Zigzag -->
    <path d="M20 365 L30 375 L40 365 L50 375 L60 365"/>
    
    <!-- Smile face -->
    <circle cx="100" cy="370" r="15"/>
    <circle cx="94" cy="366" r="2" fill="#1a1a1a"/>
    <circle cx="106" cy="366" r="2" fill="#1a1a1a"/>
    <path d="M94 376 Q100 382 106 376"/>
    
    <!-- Cloud -->
    <path d="M140 375 Q135 365 145 360 Q155 355 165 360 Q175 355 180 365 Q185 375 175 378 L145 378 Q135 378 140 375"/>
    
    <!-- @TAIF text -->
    <text x="210" y="375" font-family="Arial" font-size="12" fill="#1a1a1a" opacity="0.5">@TAIF</text>
    
    <!-- Plane -->
    <path d="M280 360 L310 375 L280 380 L285 370 Z"/>
    <path d="M285 370 L270 375"/>
    
    <!-- Sparkles -->
    <path d="M350 355 L350 365 M345 360 L355 360"/>
    <path d="M365 370 L365 380 M360 375 L370 375"/>
    <path d="M340 380 L340 388 M336 384 L344 384"/>
    
  </g>
</svg>
